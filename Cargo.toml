[package]
name = "uvd"
version = "0.1.1"
edition = "2024"
description = "Universal Vault Distribution"
keywords = ["vault", "distribution", "cli"]
repository = "https://github.com/kognitara/uvd"


[dependencies]
clap = "4.6.6"
clap_complete = "4.6.9"
inquire = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yml = "0.0.13"
tar = "0.4.46"
zstd = "0.13.3"
